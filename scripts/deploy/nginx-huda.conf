# HUDA Web — Nginx reverse proxy template (Debian 12 + HTTPS via Let's Encrypt)
#
# Copy to /etc/nginx/sites-available/huda-<instance> and edit:
#   - server_name  -> your real domain
#   - proxy port   -> 3000 (production) or 3001 (staging)
#   - certificate paths after `certbot --nginx -d <domain>`
#
# The app MUST be served over HTTPS in production: auth cookies are issued
# with the Secure flag only when the request arrives over HTTPS.

# --- HTTP -> HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;
    return 301 https://$host$request_uri;
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN_PLACEHOLDER;   # TODO: set the real domain

    # TODO: created by `certbot certonly --nginx -d DOMAIN_PLACEHOLDER`
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Immutable Next.js build assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Locally-hosted fonts (QCF mushaf + app fonts)
    location /fonts/ {
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Everything else (pages + APIs)
    location / {
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
